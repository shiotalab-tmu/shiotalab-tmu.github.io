name: Build Check

on:
  # main ブランチへのPR作成・更新時に、Astroのビルドが通るか検証する
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# 同じPRで新しいコミットがpushされたら、古い実行は取り消す
concurrency:
  group: build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build
